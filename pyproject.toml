[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "b24-ai-auditor"
version = "0.1.0"
description = "AI-аудитор для Битрикс24 на LangGraph + DeepSeek API"
authors = [
    {name = "Your Name"}
]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0,<1.0",
    "langchain-openai>=0.2.0,<1.0",
    "fast-bitrix24>=1.0.0,<2.0",
    "python-dotenv>=1.0.0,<2.0",
    "pydantic-settings>=2.0.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "itsdangerous>=2.1.0,<3.0",
    "argon2-cffi>=23.1.0,<26.0"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "black>=24.1.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "openpyxl>=3.1.0",
]

[tool.pytest.ini_options]
norecursedirs = ["scripts"]