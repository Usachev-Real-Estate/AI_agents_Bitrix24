# Референсный конфиг nginx для pars.afina-crm.ru/dashboard.
#
# Скопировать в /etc/nginx/sites-available/pars.afina-crm.ru, включить
# симлинком в sites-enabled, затем выпустить сертификат:
#     certbot --nginx -d pars.afina-crm.ru
#
# Два принципа, ради которых этот файл выглядит именно так:
#   1. Приложение слушает только 127.0.0.1:8080. Порт наружу не публикуется.
#   2. Наружу отдаётся только /dashboard/ и /healthz. Всё остальное — 404,
#      чтобы домен не превращался в карту сервисов сервера.

server {
    listen 80;
    listen [::]:80;
    server_name pars.afina-crm.ru;

    # Единственное, что отвечает по http, — проверка домена certbot-ом.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pars.afina-crm.ru;

    ssl_certificate     /etc/letsencrypt/live/pars.afina-crm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pars.afina-crm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовки безопасности приложение выставляет само (CSP, HSTS,
    # X-Frame-Options и прочие). Здесь их не дублируем, чтобы не разъезжались
    # две копии одной политики.

    access_log /var/log/nginx/pars.afina-crm.ru.access.log;
    error_log  /var/log/nginx/pars.afina-crm.ru.error.log;

    # Выгрузка CSV на большой выборке идёт дольше стандартных 60 секунд.
    proxy_read_timeout 120s;
    client_max_body_size 1m;

    location /dashboard/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
    }

    # Без слеша браузер иначе получит 404 вместо перехода в дашборд.
    location = /dashboard {
        return 301 /dashboard/;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }

    # Всё остальное на домене не существует.
    location / {
        return 404;
    }
}
