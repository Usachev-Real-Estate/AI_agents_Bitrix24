services:
  auditor:
    build: .
    container_name: b24-ai-auditor
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: ["python", "src/main.py"]

  # Веб-дашборд аналитики. Слушает только localhost: наружу его выставляет
  # nginx, он же терминирует TLS. Публикация как "8080:8080" пробила бы порт
  # мимо ufw через цепочку DOCKER-USER — дашборд оказался бы в интернете
  # без шифрования.
  dashboard:
    build: .
    container_name: b24-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Внутри контейнера слушать надо 0.0.0.0: 127.0.0.1 — это петля самого
      # контейнера, и проброс порта до неё не достаёт. Приватность
      # обеспечивает публикация на хосте строго на 127.0.0.1 (ниже), а не
      # адрес привязки внутри.
      DASHBOARD_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8080:8080"
    # Афина CRM живёт на другом хосте, и её публичный адрес с этой машины не
    # открывается. Подменяем не адрес в настройках, а разрешение имени: имя
    # обязано остаться публичным, потому что сертификат выписан на него (по
    # IP проверка не пройдёт), а nginx на той стороне разбирает vhost по
    # заголовку Host — без него он отдаёт дефолтный сайт и 502.
    # Значение живёт в .env, а не здесь: внутренний адрес — свойство
    # площадки, а не проекта. Пример: AFINA_CRM_HOST_ENTRY=afina-crm.ru:10.0.0.1
    # По умолчанию запись холостая (домен .invalid зарезервирован RFC 2606 и
    # не существует): интеграции нет — нет и подмены.
    extra_hosts:
      - "${AFINA_CRM_HOST_ENTRY:-afina-crm.invalid:127.0.0.1}"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: ["python", "src/web/server.py"]
